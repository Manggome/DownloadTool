name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  build:
    runs-on: ubuntu-latest

    # 고정 debug 키 커밋 + 릴리스 발행 + 실패 로그 발행에 필요
    permissions:
      contents: write

    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          curl -sSLo /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          mkdir -p "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # 빌드마다 서명 키가 바뀌면 기존 앱을 지워야만 설치된다.
      # 키를 저장소에 한 번 만들어 고정해두면 덮어쓰기 업데이트가 된다.
      - name: Ensure fixed debug keystore
        run: |
          if [ -f keystore/debug.jks ]; then
            echo "고정 debug 키 존재 — 그대로 사용합니다."
            exit 0
          fi
          echo "고정 debug 키가 없어 새로 만듭니다."
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/debug.jks -storetype PKCS12 -alias linksaver -keyalg RSA -keysize 2048 -validity 10000 -storepass linksaver -keypass linksaver -dname "CN=LinkSaver Debug, OU=Personal, O=Personal, L=Seoul, C=KR"

          if [ "$IS_MAIN" = "true" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore/debug.jks
            git commit -q -m "ci: 고정 debug 서명 키 생성 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "키를 저장소에 커밋했습니다. 이후 빌드부터 덮어쓰기 설치가 됩니다."
          fi

      - name: Environment check
        run: |
          echo "--- java ---"
          java -version
          echo "--- gradle ---"
          gradle --version
          echo "--- sdk ---"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- version ---"
          echo "versionCode=$((1 + GITHUB_RUN_NUMBER)) versionName=1.0.${GITHUB_RUN_NUMBER}"

      - name: Decode signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks

      - name: Build release APK (signed)
        if: env.KEYSTORE_B64 != ''
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --no-build-cache --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Build debug APK
        if: env.KEYSTORE_B64 == ''
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-build-cache --stacktrace 2>&1 | tee /tmp/gradle.log

      # 폰에서 바로 받을 수 있도록 알아보기 쉬운 이름으로 정리한다.
      # arm64-v8a 가 사실상 모든 최신 폰의 ABI 이므로 이것을 기본 파일로 삼는다.
      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*arm64-v8a*.apk'   -exec cp {} dist/LinkSaver.apk \;
          find app/build/outputs/apk -name '*armeabi-v7a*.apk' -exec cp {} dist/LinkSaver-armeabi-v7a.apk \;
          find app/build/outputs/apk -name '*x86_64*.apk'      -exec cp {} dist/LinkSaver-x86_64.apk \;

          # 앱이 자기 버전과 비교해 스스로 업데이트할 수 있도록 버전 정보를 함께 올린다
          python3 - > dist/latest.json <<'PYJSON'
          import json, os, subprocess
          run = int(os.environ.get("GITHUB_RUN_NUMBER", "0"))
          notes = subprocess.run(
              ["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True
          ).stdout.strip()
          print(json.dumps({
              "versionCode": 1 + run,
              "versionName": "1.0." + str(run),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "notes": notes,
          }, ensure_ascii=False, indent=2))
          PYJSON

          cat dist/latest.json
          ls -lh dist
          test -f dist/LinkSaver.apk

      # latest 태그를 갱신해 항상 같은 주소로 받을 수 있게 한다:
      # https://github.com/<repo>/releases/latest/download/LinkSaver.apk
      - name: Publish release
        if: env.IS_MAIN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'NOTES'
          폰에서 아래 파일을 눌러 바로 설치하세요.

          - **LinkSaver.apk** — 대부분의 폰 (arm64-v8a)
          - LinkSaver-armeabi-v7a.apk — 오래된 32비트 폰
          - LinkSaver-x86_64.apk — 에뮬레이터

          앱 안에서 `설정 > 앱 업데이트` 로도 받을 수 있습니다.
          NOTES
          echo "" >> /tmp/notes.md
          echo "버전: 1.0.${GITHUB_RUN_NUMBER} · 커밋: ${GITHUB_SHA}" >> /tmp/notes.md

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --title "링크세이버 1.0.${GITHUB_RUN_NUMBER}" --notes-file /tmp/notes.md dist/LinkSaver.apk dist/LinkSaver-armeabi-v7a.apk dist/LinkSaver-x86_64.apk dist/latest.json

          echo "## 설치 링크" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/LinkSaver.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs (백업용 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: linksaver-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # 실패 시: 원인만 뽑아 로그 하단 / 실행 요약 / ci-logs 브랜치 에 발행
      - name: 실패 원인 발행
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/gradle.log ]; then
            echo "Gradle 로그 없음 — 빌드 이전 단계에서 실패했습니다."
            exit 0
          fi

          SUM=/tmp/failure-summary.txt
          {
            echo "commit : $GITHUB_SHA"
            echo "run    : $GITHUB_RUN_ID"
            echo
            echo "=========== Kotlin / Java 컴파일 에러 ==========="
            grep -E "^(e|w): " /tmp/gradle.log | head -60 || true
            echo
            echo "=========== What went wrong ==========="
            sed -n '/^FAILURE: Build failed/,/^\* Try:/p' /tmp/gradle.log | head -80 || true
            echo
            echo "=========== Caused by ==========="
            grep -E "Caused by:" /tmp/gradle.log | head -20 || true
            echo
            echo "=========== 마지막 80줄 (스택트레이스 제외) ==========="
            grep -vE "^[[:space:]]+at " /tmp/gradle.log | tail -80 || true
          } > "$SUM"

          echo "=================== 실패 원인 ==================="
          cat "$SUM"
          echo "================================================"

          {
            echo '## ❌ 빌드 실패 원인'
            echo ''
            echo '```'
            cat "$SUM"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          git init -q
          git checkout -q -b ci-logs
          cp "$SUM" last-failure.txt
          cp /tmp/gradle.log gradle-full.log
          git add -A
          git -c user.name='github-actions' -c user.email='actions@github.com' commit -q -m "ci: 빌드 실패 로그 ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Clean up release keystore
        if: always()
        run: rm -f keystore/release.jks
