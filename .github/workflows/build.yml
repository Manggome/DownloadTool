name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  build:
    runs-on: ubuntu-latest

    # 실패 로그를 ci-logs 브랜치에 발행하기 위해 필요
    permissions:
      contents: write

    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # gradle/actions/setup-gradle 는 settings 단계에 init script 를 주입하므로
      # 원인 분리를 위해 Gradle 을 직접 설치해서 쓴다.
      - name: Install Gradle
        run: |
          curl -sSLo /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          mkdir -p "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Environment check
        run: |
          echo "--- java ---";   java -version
          echo "--- gradle ---"; gradle --version
          echo "--- sdk ---";    echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" || true

      # KEYSTORE_B64 시크릿이 있으면 서명된 release, 없으면 debug 를 만든다
      - name: Decode signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          echo "서명 키를 복원했습니다."

      - name: Build release APK (signed)
        if: env.KEYSTORE_B64 != ''
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --no-build-cache --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Build debug APK
        if: env.KEYSTORE_B64 == ''
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-build-cache --stacktrace 2>&1 | tee /tmp/gradle.log

      # 실패 시: 원인만 뽑아 (1) 로그 하단 (2) 실행 요약 (3) ci-logs 브랜치 에 발행.
      # (3) 덕분에 비인증 상태에서도 raw.githubusercontent.com 으로 원인을 읽을 수 있다.
      - name: 실패 원인 발행
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/gradle.log ]; then
            echo "Gradle 로그 없음 — 빌드 이전 단계에서 실패했습니다."
            exit 0
          fi

          SUM=/tmp/failure-summary.txt
          {
            echo "commit : $GITHUB_SHA"
            echo "run    : $GITHUB_RUN_ID"
            echo
            echo "=========== Kotlin / Java 컴파일 에러 ==========="
            grep -E "^(e|w): " /tmp/gradle.log | head -60 || true
            echo
            echo "=========== What went wrong ==========="
            sed -n '/^FAILURE: Build failed/,/^\* Try:/p' /tmp/gradle.log | head -80 || true
            echo
            echo "=========== Caused by ==========="
            grep -E "Caused by:" /tmp/gradle.log | head -20 || true
            echo
            echo "=========== 마지막 80줄 (스택트레이스 제외) ==========="
            grep -vE "^[[:space:]]+at " /tmp/gradle.log | tail -80 || true
          } > "$SUM"

          echo "=================== 실패 원인 ==================="
          cat "$SUM"
          echo "================================================"

          {
            echo '## ❌ 빌드 실패 원인'
            echo ''
            echo '```'
            cat "$SUM"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # ci-logs 브랜치에 강제 발행 (orphan 브랜치, 매번 덮어씀)
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          git init -q
          git checkout -q -b ci-logs
          cp "$SUM" last-failure.txt
          cp /tmp/gradle.log gradle-full.log
          git add -A
          git -c user.name='github-actions' -c user.email='actions@github.com' \
              commit -q -m "ci: 빌드 실패 로그 ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
          echo "발행 완료: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-logs/last-failure.txt"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: List outputs
        run: find app/build/outputs/apk -name '*.apk' -printf '%p  %s bytes\n'

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: linksaver-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -rf keystore
