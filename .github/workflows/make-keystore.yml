name: Create signing keystore (한 번만 실행)

# 앱을 업데이트 설치하려면 항상 같은 키로 서명해야 합니다.
# 이 워크플로를 한 번만 수동 실행해서 키를 만들고, 산출물을 시크릿에 등록하세요.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: '키 별칭 (기본 linksaver)'
        required: false
        default: 'linksaver'
      password:
        description: '키스토어 비밀번호 (기본 linksaver)'
        required: false
        default: 'linksaver'

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          ALIAS: ${{ github.event.inputs.alias }}
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=LinkSaver, OU=Personal, O=Personal, L=Seoul, S=Seoul, C=KR"
          base64 -w0 out/release.jks > out/release.jks.base64.txt
          {
            echo "## 다음 4개를 Settings > Secrets and variables > Actions 에 등록하세요"
            echo ""
            echo "| 시크릿 이름 | 값 |"
            echo "|---|---|"
            echo "| KEYSTORE_B64 | 아티팩트의 release.jks.base64.txt 내용 전체 |"
            echo "| KEYSTORE_PASSWORD | $PASSWORD |"
            echo "| KEY_ALIAS | $ALIAS |"
            echo "| KEY_PASSWORD | $PASSWORD |"
            echo ""
            echo "release.jks 원본도 안전한 곳에 백업해 두세요. 잃어버리면 기존 앱을 덮어쓰기 업데이트할 수 없습니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: out/
          retention-days: 1
